services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${WORDPRESS_DB_NAME:?WORDPRESS_DB_NAME is required}
      MYSQL_USER: ${WORDPRESS_DB_USER:?WORDPRESS_DB_USER is required}
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD:?WORDPRESS_DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - dr_purg_jr_db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  wordpress:
    build:
      context: .
      dockerfile: docker/wordpress/Dockerfile
    image: dr-purg-jr-wordpress:latest
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: mariadb:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:?WORDPRESS_DB_NAME is required}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:?WORDPRESS_DB_USER is required}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:?WORDPRESS_DB_PASSWORD is required}
      WP_ADMIN_USER: ${WP_ADMIN_USER:?WP_ADMIN_USER is required}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:?WP_ADMIN_PASSWORD is required}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:?WP_ADMIN_EMAIL is required}
      SITE_URL: ${SITE_URL:-https://health.ibnbatoutaweb.com}
      SITE_EMAIL: ${SITE_EMAIL:-contact@health.ibnbatoutaweb.com}
      WRITER_EMAIL: ${WRITER_EMAIL:-editor@health.ibnbatoutaweb.com}
      WP_LOCALE: ${WP_LOCALE:-en_US}
      WP_ADMIN_LOCALE: ${WP_ADMIN_LOCALE:-en_US}
      KEPOLI_AUTOSEED_ENABLE: ${KEPOLI_AUTOSEED_ENABLE:-1}
      KEPOLI_FORCE_RESEED: ${KEPOLI_FORCE_RESEED:-0}
      CANONICAL_REDIRECT_HOSTS: ${CANONICAL_REDIRECT_HOSTS:-www.health.ibnbatoutaweb.com}
      PORT: ${PORT:-80}
      SERVICE_FQDN_WORDPRESS_80: ${SERVICE_FQDN_WORDPRESS_80:-https://health.ibnbatoutaweb.com}
      ADSENSE_CLIENT_ID: ${ADSENSE_CLIENT_ID:-}
      ADSENSE_PUB_ID: ${ADSENSE_PUB_ID:-}
      ADSENSE_ENABLE: ${ADSENSE_ENABLE:-0}
      ADSENSE_SLOT_HEADER: ${ADSENSE_SLOT_HEADER:-}
      ADSENSE_SLOT_AFTER_INTRO: ${ADSENSE_SLOT_AFTER_INTRO:-}
      ADSENSE_SLOT_MID_CONTENT: ${ADSENSE_SLOT_MID_CONTENT:-}
      ADSENSE_SLOT_SIDEBAR: ${ADSENSE_SLOT_SIDEBAR:-}
      ADSENSE_SLOT_BELOW_CONTENT: ${ADSENSE_SLOT_BELOW_CONTENT:-}
      DISPLAY_ADS_ENABLE: ${DISPLAY_ADS_ENABLE:-0}
      DISPLAY_ADS_PROVIDER: ${DISPLAY_ADS_PROVIDER:-adsterra}
      DISPLAY_AD_HEADER_BASE64: ${DISPLAY_AD_HEADER_BASE64:-}
      DISPLAY_AD_AFTER_INTRO_BASE64: ${DISPLAY_AD_AFTER_INTRO_BASE64:-}
      DISPLAY_AD_READING_OPTION_BASE64: ${DISPLAY_AD_READING_OPTION_BASE64:-}
      DISPLAY_AD_MID_CONTENT_BASE64: ${DISPLAY_AD_MID_CONTENT_BASE64:-}
      DISPLAY_AD_PART_CONTINUE_BASE64: ${DISPLAY_AD_PART_CONTINUE_BASE64:-}
      DISPLAY_AD_BELOW_CONTENT_BASE64: ${DISPLAY_AD_BELOW_CONTENT_BASE64:-}
      DISPLAY_AD_CARD_GRID_BASE64: ${DISPLAY_AD_CARD_GRID_BASE64:-}
      DISPLAY_AD_SIDEBAR_BASE64: ${DISPLAY_AD_SIDEBAR_BASE64:-}
      DISPLAY_AD_STICKY_BOTTOM_BASE64: ${DISPLAY_AD_STICKY_BOTTOM_BASE64:-}
      DISPLAY_AD_STICKY_BOTTOM_MIN_SECONDS: ${DISPLAY_AD_STICKY_BOTTOM_MIN_SECONDS:-35}
      DISPLAY_AD_STICKY_BOTTOM_MIN_SCROLL: ${DISPLAY_AD_STICKY_BOTTOM_MIN_SCROLL:-30}
      DISPLAY_AD_STICKY_BOTTOM_COOLDOWN_MINUTES: ${DISPLAY_AD_STICKY_BOTTOM_COOLDOWN_MINUTES:-30}
      EZOIC_ADSTXT_ACCOUNT_ID: ${EZOIC_ADSTXT_ACCOUNT_ID:-}
      EZOIC_ADSTXT_REDIRECT_URL: ${EZOIC_ADSTXT_REDIRECT_URL:-}
      EZOIC_PLUGIN_ENABLE: ${EZOIC_PLUGIN_ENABLE:-0}
      KT_AD_MODE: ${KT_AD_MODE:-baseline}
      KT_PRELANDER_ENABLE: ${KT_PRELANDER_ENABLE:-0}
      KT_ACTION_AD_MIN_SECONDS: ${KT_ACTION_AD_MIN_SECONDS:-45}
      KT_ACTION_AD_MIN_SCROLL: ${KT_ACTION_AD_MIN_SCROLL:-35}
      MONETAG_ENABLE: ${MONETAG_ENABLE:-0}
      MONETAG_INPAGE_PUSH_BASE64: ${MONETAG_INPAGE_PUSH_BASE64:-}
      MONETAG_VIGNETTE_BASE64: ${MONETAG_VIGNETTE_BASE64:-}
      MONETAG_ONCLICK_BASE64: ${MONETAG_ONCLICK_BASE64:-}
      MONETAG_PUSH_BASE64: ${MONETAG_PUSH_BASE64:-}
      MONETAG_INPAGE_PUSH_MINUTES: ${MONETAG_INPAGE_PUSH_MINUTES:-0}
      MONETAG_VIGNETTE_MINUTES: ${MONETAG_VIGNETTE_MINUTES:-0}
      MONETAG_ONCLICK_MINUTES: ${MONETAG_ONCLICK_MINUTES:-0}
      MONETAG_PUSH_MINUTES: ${MONETAG_PUSH_MINUTES:-0}
      MONETAG_POST_ONLY: ${MONETAG_POST_ONLY:-1}
      MONETAG_INSTALL_CHECK: ${MONETAG_INSTALL_CHECK:-0}
      MONETAG_VERIFICATION: ${MONETAG_VERIFICATION:-}
      MONETAG_SW_JS_BASE64: ${MONETAG_SW_JS_BASE64:-}
      GA_ENABLE: ${GA_ENABLE:-0}
      GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID:-}
      SEARCH_CONSOLE_VERIFICATION: ${SEARCH_CONSOLE_VERIFICATION:-}
      HISTATS_ENABLE: ${HISTATS_ENABLE:-0}
      HISTATS_CODE_BASE64: ${HISTATS_CODE_BASE64:-}
      HISTATS_EXCLUDE_ADMINS: ${HISTATS_EXCLUDE_ADMINS:-1}
      AI_EXTRACTION_ENABLE: ${AI_EXTRACTION_ENABLE:-0}
      AI_EXTRACTION_PROVIDER: ${AI_EXTRACTION_PROVIDER:-openrouter}
      AI_EXTRACTION_API_KEY: ${AI_EXTRACTION_API_KEY:-}
      AI_EXTRACTION_MODEL: ${AI_EXTRACTION_MODEL:-inclusionai/ling-2.6-1t:free}
      AI_EXTRACTION_TIMEOUT_SECONDS: ${AI_EXTRACTION_TIMEOUT_SECONDS:-14}
      AI_EXTRACTION_MAX_CHARS: ${AI_EXTRACTION_MAX_CHARS:-9000}
      AI_EXTRACTION_MAX_TOKENS: ${AI_EXTRACTION_MAX_TOKENS:-1400}
      SOCIAL_AI_ENABLE: ${SOCIAL_AI_ENABLE:-}
      SOCIAL_AI_PROVIDER: ${SOCIAL_AI_PROVIDER:-openrouter}
      SOCIAL_AI_API_KEY: ${SOCIAL_AI_API_KEY:-}
      SOCIAL_AI_MODEL: ${SOCIAL_AI_MODEL:-}
      SOCIAL_AI_TIMEOUT_SECONDS: ${SOCIAL_AI_TIMEOUT_SECONDS:-16}
      SOCIAL_AI_MAX_CHARS: ${SOCIAL_AI_MAX_CHARS:-6500}
      SOCIAL_AI_MAX_TOKENS: ${SOCIAL_AI_MAX_TOKENS:-1200}
    volumes:
      - dr_purg_jr_wordpress:/var/www/html
      - dr_purg_jr_uploads:/var/www/html/wp-content/uploads
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/robots.txt >/dev/null || exit 1"]
      start_period: 5m
      interval: 30s
      timeout: 10s
      retries: 10

  wp-init:
    profiles:
      - seed
    build:
      context: .
      dockerfile: docker/wp-cli/Dockerfile
    image: dr-purg-jr-wp-cli:latest
    restart: "no"
    depends_on:
      mariadb:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: mariadb:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:?WORDPRESS_DB_NAME is required}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:?WORDPRESS_DB_USER is required}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:?WORDPRESS_DB_PASSWORD is required}
      SITE_URL: ${SITE_URL:-https://health.ibnbatoutaweb.com}
      SITE_EMAIL: ${SITE_EMAIL:-contact@health.ibnbatoutaweb.com}
      WRITER_EMAIL: ${WRITER_EMAIL:-editor@health.ibnbatoutaweb.com}
      WP_LOCALE: ${WP_LOCALE:-en_US}
      WP_ADMIN_LOCALE: ${WP_ADMIN_LOCALE:-en_US}
      KEPOLI_AUTOSEED_ENABLE: ${KEPOLI_AUTOSEED_ENABLE:-1}
      KEPOLI_FORCE_RESEED: ${KEPOLI_FORCE_RESEED:-0}
      CANONICAL_REDIRECT_HOSTS: ${CANONICAL_REDIRECT_HOSTS:-www.health.ibnbatoutaweb.com}
      WP_ADMIN_USER: ${WP_ADMIN_USER:?WP_ADMIN_USER is required}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:?WP_ADMIN_PASSWORD is required}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:?WP_ADMIN_EMAIL is required}
      ADSENSE_CLIENT_ID: ${ADSENSE_CLIENT_ID:-}
      ADSENSE_PUB_ID: ${ADSENSE_PUB_ID:-}
      ADSENSE_ENABLE: ${ADSENSE_ENABLE:-0}
      DISPLAY_ADS_ENABLE: ${DISPLAY_ADS_ENABLE:-0}
      DISPLAY_ADS_PROVIDER: ${DISPLAY_ADS_PROVIDER:-adsterra}
      DISPLAY_AD_HEADER_BASE64: ${DISPLAY_AD_HEADER_BASE64:-}
      DISPLAY_AD_AFTER_INTRO_BASE64: ${DISPLAY_AD_AFTER_INTRO_BASE64:-}
      DISPLAY_AD_READING_OPTION_BASE64: ${DISPLAY_AD_READING_OPTION_BASE64:-}
      DISPLAY_AD_MID_CONTENT_BASE64: ${DISPLAY_AD_MID_CONTENT_BASE64:-}
      DISPLAY_AD_PART_CONTINUE_BASE64: ${DISPLAY_AD_PART_CONTINUE_BASE64:-}
      DISPLAY_AD_BELOW_CONTENT_BASE64: ${DISPLAY_AD_BELOW_CONTENT_BASE64:-}
      DISPLAY_AD_CARD_GRID_BASE64: ${DISPLAY_AD_CARD_GRID_BASE64:-}
      DISPLAY_AD_SIDEBAR_BASE64: ${DISPLAY_AD_SIDEBAR_BASE64:-}
      DISPLAY_AD_STICKY_BOTTOM_BASE64: ${DISPLAY_AD_STICKY_BOTTOM_BASE64:-}
      DISPLAY_AD_STICKY_BOTTOM_MIN_SECONDS: ${DISPLAY_AD_STICKY_BOTTOM_MIN_SECONDS:-35}
      DISPLAY_AD_STICKY_BOTTOM_MIN_SCROLL: ${DISPLAY_AD_STICKY_BOTTOM_MIN_SCROLL:-30}
      DISPLAY_AD_STICKY_BOTTOM_COOLDOWN_MINUTES: ${DISPLAY_AD_STICKY_BOTTOM_COOLDOWN_MINUTES:-30}
      EZOIC_ADSTXT_ACCOUNT_ID: ${EZOIC_ADSTXT_ACCOUNT_ID:-}
      EZOIC_ADSTXT_REDIRECT_URL: ${EZOIC_ADSTXT_REDIRECT_URL:-}
      EZOIC_PLUGIN_ENABLE: ${EZOIC_PLUGIN_ENABLE:-0}
      KT_AD_MODE: ${KT_AD_MODE:-baseline}
      KT_PRELANDER_ENABLE: ${KT_PRELANDER_ENABLE:-0}
      KT_ACTION_AD_MIN_SECONDS: ${KT_ACTION_AD_MIN_SECONDS:-45}
      KT_ACTION_AD_MIN_SCROLL: ${KT_ACTION_AD_MIN_SCROLL:-35}
      MONETAG_ENABLE: ${MONETAG_ENABLE:-0}
      MONETAG_INPAGE_PUSH_BASE64: ${MONETAG_INPAGE_PUSH_BASE64:-}
      MONETAG_VIGNETTE_BASE64: ${MONETAG_VIGNETTE_BASE64:-}
      MONETAG_ONCLICK_BASE64: ${MONETAG_ONCLICK_BASE64:-}
      MONETAG_PUSH_BASE64: ${MONETAG_PUSH_BASE64:-}
      MONETAG_INPAGE_PUSH_MINUTES: ${MONETAG_INPAGE_PUSH_MINUTES:-0}
      MONETAG_VIGNETTE_MINUTES: ${MONETAG_VIGNETTE_MINUTES:-0}
      MONETAG_ONCLICK_MINUTES: ${MONETAG_ONCLICK_MINUTES:-0}
      MONETAG_PUSH_MINUTES: ${MONETAG_PUSH_MINUTES:-0}
      MONETAG_POST_ONLY: ${MONETAG_POST_ONLY:-1}
      MONETAG_INSTALL_CHECK: ${MONETAG_INSTALL_CHECK:-0}
      MONETAG_VERIFICATION: ${MONETAG_VERIFICATION:-}
      MONETAG_SW_JS_BASE64: ${MONETAG_SW_JS_BASE64:-}
      GA_ENABLE: ${GA_ENABLE:-0}
      GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID:-}
      SEARCH_CONSOLE_VERIFICATION: ${SEARCH_CONSOLE_VERIFICATION:-}
      HISTATS_ENABLE: ${HISTATS_ENABLE:-0}
      HISTATS_CODE_BASE64: ${HISTATS_CODE_BASE64:-}
      HISTATS_EXCLUDE_ADMINS: ${HISTATS_EXCLUDE_ADMINS:-1}
      AI_EXTRACTION_ENABLE: ${AI_EXTRACTION_ENABLE:-0}
      AI_EXTRACTION_PROVIDER: ${AI_EXTRACTION_PROVIDER:-openrouter}
      AI_EXTRACTION_API_KEY: ${AI_EXTRACTION_API_KEY:-}
      AI_EXTRACTION_MODEL: ${AI_EXTRACTION_MODEL:-inclusionai/ling-2.6-1t:free}
      AI_EXTRACTION_TIMEOUT_SECONDS: ${AI_EXTRACTION_TIMEOUT_SECONDS:-14}
      AI_EXTRACTION_MAX_CHARS: ${AI_EXTRACTION_MAX_CHARS:-9000}
      AI_EXTRACTION_MAX_TOKENS: ${AI_EXTRACTION_MAX_TOKENS:-1400}
      SOCIAL_AI_ENABLE: ${SOCIAL_AI_ENABLE:-}
      SOCIAL_AI_PROVIDER: ${SOCIAL_AI_PROVIDER:-openrouter}
      SOCIAL_AI_API_KEY: ${SOCIAL_AI_API_KEY:-}
      SOCIAL_AI_MODEL: ${SOCIAL_AI_MODEL:-}
      SOCIAL_AI_TIMEOUT_SECONDS: ${SOCIAL_AI_TIMEOUT_SECONDS:-16}
      SOCIAL_AI_MAX_CHARS: ${SOCIAL_AI_MAX_CHARS:-6500}
      SOCIAL_AI_MAX_TOKENS: ${SOCIAL_AI_MAX_TOKENS:-1200}
    volumes:
      - dr_purg_jr_wordpress:/var/www/html
      - dr_purg_jr_uploads:/var/www/html/wp-content/uploads

volumes:
  dr_purg_jr_db:
  dr_purg_jr_wordpress:
  dr_purg_jr_uploads:
